<div class="auth-viewport">
  <div class="auth-card">
    <div class="auth-stripe" aria-hidden="true"></div>

    <div class="auth-brand">
      <div class="logo-mark" aria-hidden="true">
        <ft-icon name="logo" />
      </div>
      <div>
        <div class="brand-name">FitTrack Pro</div>
        <div class="brand-tag" i18n="@@auth.login.tagline">Sign in to your training console</div>
      </div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <ft-form-field
        for="login-email"
        label="Email"
        i18n-label="@@auth.login.emailLabel"
        [error]="showEmailError() ? emailErrorText : null"
      >
        <input
          id="login-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="you@example.com"
        />
      </ft-form-field>

      <ft-form-field
        for="login-password"
        label="Password"
        i18n-label="@@auth.login.passwordLabel"
        [error]="showPasswordError() ? passwordErrorText : null"
      >
        <input
          id="login-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </ft-form-field>

      @if (errorMessage) {
        <div class="error-banner" role="alert">{{ errorMessage }}</div>
      }

      <button
        ft-button
        variant="primary"
        [block]="true"
        type="submit"
        [attr.disabled]="loginForm.invalid || loading ? true : null"
      >
        @if (loading) {
          <ng-container i18n="@@auth.login.submitting">Signing in…</ng-container>
        } @else {
          <ng-container i18n="@@auth.login.submit">Sign in</ng-container>
        }
      </button>

      <div class="alt-link">
        <span i18n="@@auth.login.registerPrompt">Don't have an account?</span>
        <a routerLink="/auth/register" i18n="@@auth.login.registerCta">Create one</a>
      </div>
    </form>
  </div>
</div>
