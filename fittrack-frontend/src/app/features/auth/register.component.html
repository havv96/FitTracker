<div class="auth-viewport">
  <div class="auth-card">
    <div class="auth-stripe" aria-hidden="true"></div>

    <div class="auth-brand">
      <div class="logo-mark" aria-hidden="true">
        <ft-icon name="logo" />
      </div>
      <div>
        <div class="brand-name">FitTrack Pro</div>
        <div class="brand-tag" i18n="@@auth.register.tagline">Create your training account</div>
      </div>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <ft-form-field
        for="reg-email"
        label="Email"
        i18n-label="@@auth.register.emailLabel"
        [error]="showEmailError() ? emailErrorText : null"
      >
        <input
          id="reg-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="you@example.com"
        />
      </ft-form-field>

      <ft-form-field
        for="reg-password"
        label="Password"
        i18n-label="@@auth.register.passwordLabel"
        [hint]="passwordHintText"
        [error]="showPasswordError() ? passwordErrorText : null"
      >
        <input
          id="reg-password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
        />
      </ft-form-field>

      @if (errorMessage) {
        <div class="error-banner" role="alert">{{ errorMessage }}</div>
      }

      <button
        ft-button
        variant="primary"
        [block]="true"
        type="submit"
        [attr.disabled]="registerForm.invalid || loading ? true : null"
      >
        @if (loading) {
          <ng-container i18n="@@auth.register.submitting">Creating account…</ng-container>
        } @else {
          <ng-container i18n="@@auth.register.submit">Create account</ng-container>
        }
      </button>

      <div class="alt-link">
        <span i18n="@@auth.register.loginPrompt">Already have an account?</span>
        <a routerLink="/auth/login" i18n="@@auth.register.loginCta">Sign in</a>
      </div>
    </form>
  </div>
</div>
