version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fittrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fittrack
      POSTGRES_USER: fittrack_user
      POSTGRES_PASSWORD: fittrack_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fittrack-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fittrack_user -d fittrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./fittrack-backend
      dockerfile: Dockerfile
    container_name: fittrack-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fittrack
      SPRING_DATASOURCE_USERNAME: fittrack_user
      SPRING_DATASOURCE_PASSWORD: fittrack_pass
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-change-in-production}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    networks:
      - fittrack-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  fittrack-network:
    driver: bridge
