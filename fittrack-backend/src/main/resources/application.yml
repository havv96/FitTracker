spring:
  application:
    name: fittrack-backend
  profiles:
    active: ${SPRING_PROFILE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fittrack}
    username: ${DB_USER:fittrack_user}
    password: ${DB_PASSWORD:fittrack_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

jwt:
  # MUST be a base64-encoded random value of at least 32 bytes (256 bits) for HS256.
  # Generate with: openssl rand -base64 32
  # The default below (base64 of "change-me-please-32-bytes-secret") is DEV-ONLY.
  # Boot will refuse if this is left blank or set to any known weak default.
  secret: ${JWT_SECRET:Y2hhbmdlLW1lLXBsZWFzZS0zMi1ieXRlcy1zZWNyZXQ=}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

cors:
  # Comma-separated list of origins allowed for cross-origin requests.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.fittrack: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
